name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --select E,F,I,B,SIM,UP --line-length 100 src tests
      - name: Black --check
        run: black --check --line-length 100 src tests
      - name: Mypy
        run: mypy --ignore-missing-imports src
      - name: Pytest (with coverage)
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=85
