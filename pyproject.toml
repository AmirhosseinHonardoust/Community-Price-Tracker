[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# Note: set to 3.12 (not the project's 3.10+ floor) purely so mypy can parse
# numpy's stub files, which use 3.12-only syntax. Our own code targets 3.10+.
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
